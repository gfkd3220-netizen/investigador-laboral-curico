name: Recoleccion y Analisis Diario

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 AM hora de Chile (Curicó)
  workflow_dispatch: 

jobs:
  ejecutar-analizador:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas openpyxl

      - name: Ejecutar Recolector y Analizador
        run: |
          python recolector.py
          python analizador.py
          # Si tienes el script generar_excel_completo.py, agrégalo aquí:
          # python generar_excel_completo.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historial.json *.xlsx
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Actualizacion diaria de vacantes" && git push)
